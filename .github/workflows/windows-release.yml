name: CI and Windows x64 release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64 packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Go tests
        run: go test ./...

      - name: Generate MyGo bindings
        run: bun run generate

      - name: Type-check frontend
        run: bun run typecheck

      - name: Build management app
        run: bunx mygo build -platform windows/amd64 -o build

      - name: Build client agent
        run: |
          mkdir -p build/client-agent
          # agent 需兼容 Win7：go1.20 是最后官方支持 Win7 的 Go，配合 agent.go.mod 降版依赖
          GOTOOLCHAIN=go1.20.14 GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=agent.go.mod -trimpath -ldflags="-s -w -H windowsgui" -o build/client-agent/agent.exe ./cmd/client
          python3 -c "import struct; d=open('build/client-agent/agent.exe','rb').read(); o=struct.unpack_from('<I',d,0x3C)[0]; assert struct.unpack_from('<H',d,o+64)[0]<=6, 'agent.exe PE min OS > 6.1, breaks Windows 7'"

      - name: Build headless manager (Windows 7+)
        run: |
          mkdir -p build/manager-headless
          # headless 管理端 embed 前端产物（mygo build 已跑过 build:web 产出 dist/）
          cp -r dist/. cmd/manager-headless/dist/
          GOTOOLCHAIN=go1.20.14 GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=agent.go.mod -trimpath -ldflags="-s -w" -o build/manager-headless/manager-headless.exe ./cmd/manager-headless
          python3 -c "import struct; d=open('build/manager-headless/manager-headless.exe','rb').read(); o=struct.unpack_from('<I',d,0x3C)[0]; assert struct.unpack_from('<H',d,o+64)[0]<=6, 'manager-headless.exe PE min OS > 6.1, breaks Windows 7'"

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          manager_exe="$(find build/windows-amd64 -maxdepth 1 -type f -iname 'lab-assistant.exe' -print -quit)"
          if [[ -z "$manager_exe" ]]; then
            echo "MyGo did not produce build/windows-amd64/lab-assistant.exe" >&2
            find build -maxdepth 4 -type f -print >&2
            exit 1
          fi

          release_dir="dist/release"
          manager_dir="dist/manager-package"
          agent_exe="build/client-agent/agent.exe"
          headless_exe="build/manager-headless/manager-headless.exe"
          mkdir -p "$release_dir" "$manager_dir"

          manager_name="clover-classroom-manager-${version}-windows-x64.exe"
          headless_name="clover-classroom-manager-headless-${version}-windows-x64.exe"
          manager_zip="clover-classroom-manager-${version}-windows-x64.zip"

          cp "$manager_exe" "$release_dir/$manager_name"
          cp "$headless_exe" "$release_dir/$headless_name"

          cp "$manager_exe" "$manager_dir/Clover-Classroom-Manager.exe"
          cp "$headless_exe" "$manager_dir/Clover-Classroom-Manager-Win7.exe"
          cp "$agent_exe" "$manager_dir/agent.exe"
          cp public/clover-mark.svg "$manager_dir/clover-mark.svg"
          cp packaging/windows/manager/README.txt "$manager_dir/README.txt"
          (cd "$manager_dir" && zip -qr "../release/$manager_zip" .)

          (cd "$release_dir" && sha256sum *.exe *.zip > SHA256SUMS.txt)

      - name: Upload Windows x64 build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows x64 assets
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-release
          path: dist/release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: 三叶草局域网课堂管理 ${{ github.ref_name }}
          body: |
            三叶草（Clover）局域网课堂管理的 Windows x64 版本。

            - 管理端 EXE：教师机运行，需 Windows 10+（mygo/WebView2）。
            - 管理端 headless EXE：无窗口管理端，教师用浏览器打开同一套管理界面，可在 Windows 7 运行。
            - 管理端 ZIP：内含桌面管理端、Win7 headless 管理端与学生端 agent.exe——客户端安装包由管理端「分发客户端」自动生成（已写入管理端地址和公钥），不单发。
            - `SHA256SUMS.txt`：发布文件校验和。

            管理端 GUI 需 Windows 10+；headless 管理端与学生端 agent 为 Windows 7+。首次连接前请使用管理端导出的配置固定公钥；安装说明见 ZIP 内 README。
          files: dist/release/*
          fail_on_unmatched_files: true
