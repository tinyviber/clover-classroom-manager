name: CI and Windows x64 release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64 packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Go tests
        run: go test ./...

      - name: Generate MyGo bindings
        run: bun run generate

      - name: Type-check frontend
        run: bun run typecheck

      - name: Build management app
        run: bunx mygo build -platform windows/amd64 -o build

      - name: Build client agent
        run: |
          mkdir -p build/client-agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H windowsgui" -o build/client-agent/agent.exe ./cmd/client

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          version_number="${version#v}"
          manager_exe="$(find build/windows-amd64 -maxdepth 1 -type f -iname 'lab-assistant.exe' -print -quit)"
          if [[ -z "$manager_exe" ]]; then
            echo "MyGo did not produce build/windows-amd64/lab-assistant.exe" >&2
            find build -maxdepth 4 -type f -print >&2
            exit 1
          fi

          release_dir="dist/release"
          manager_dir="dist/manager-package"
          client_dir="dist/client-package"
          agent_exe="build/client-agent/agent.exe"
          mkdir -p "$release_dir" "$manager_dir" "$client_dir"

          manager_name="clover-classroom-manager-${version}-windows-x64.exe"
          agent_name="clover-classroom-client-agent-${version}-windows-x64.exe"
          manager_zip="clover-classroom-manager-${version}-windows-x64.zip"
          client_zip="clover-classroom-client-package-${version}-windows-x64.zip"

          cp "$manager_exe" "$release_dir/$manager_name"
          cp "$agent_exe" "$release_dir/$agent_name"

          cp "$manager_exe" "$manager_dir/Clover-Classroom-Manager.exe"
          cp "$agent_exe" "$manager_dir/agent.exe"
          cp public/clover-mark.svg "$manager_dir/clover-mark.svg"
          cp packaging/windows/manager/README.txt "$manager_dir/README.txt"
          (cd "$manager_dir" && zip -qr "../release/$manager_zip" .)

          cp "$agent_exe" "$client_dir/agent.exe"
          cp packaging/windows/client-package/client.json "$client_dir/client.json"
          cp packaging/windows/client-package/install.bat "$client_dir/install.bat"
          cp packaging/windows/client-package/uninstall.bat "$client_dir/uninstall.bat"
          cp packaging/windows/client-package/verify-config.ps1 "$client_dir/verify-config.ps1"
          sed "s|@AGENT_STATUS@|此发行包包含 agent.exe。|g" packaging/windows/client-package/README.txt \
            | sed "s|@VERSION@|${version_number}|g" > "$client_dir/README.txt"
          (cd "$client_dir" && zip -qr "../release/$client_zip" .)

          (cd "$release_dir" && sha256sum *.exe *.zip > SHA256SUMS.txt)

      - name: Upload Windows x64 build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows x64 assets
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-release
          path: dist/release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: 三叶草局域网课堂管理 ${{ github.ref_name }}
          body: |
            三叶草（Clover）局域网课堂管理的 Windows x64 版本。

            - 管理端 EXE：教师机运行；管理端 ZIP 另外包含学生端 agent，便于直接导出已固定管理端公钥的客户端安装包。
            - 学生端 agent EXE：客户端程序本体。
            - 学生端安装包 ZIP：通用模板。首次部署请优先使用管理端“分发客户端”导出的安装包，其中已写入当前管理端地址和公钥。
            - `SHA256SUMS.txt`：发布文件校验和。

            管理端与学生端均为 Windows x86_64。首次连接前请使用管理端导出的配置固定公钥；安装说明见 ZIP 内 README。
          files: dist/release/*
          fail_on_unmatched_files: true
