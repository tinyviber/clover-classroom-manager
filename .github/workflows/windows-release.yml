name: CI and Windows x64 release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64 packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Go tests
        run: go test ./...

      - name: Generate MyGo bindings
        run: bun run generate

      - name: Type-check frontend
        run: bun run typecheck

      - name: Build client agent
        run: |
          mkdir -p packaging/windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H windowsgui" -o packaging/windows/agent.exe ./cmd/client

      - name: Build management app
        run: bunx mygo build -platform windows/amd64 -o build
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=embedagent"

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          manager_exe="$(find build/windows-amd64 -maxdepth 1 -type f -iname 'lab-assistant.exe' -print -quit)"
          if [[ -z "$manager_exe" ]]; then
            echo "MyGo did not produce build/windows-amd64/lab-assistant.exe" >&2
            find build -maxdepth 4 -type f -print >&2
            exit 1
          fi

          release_dir="dist/release"
          mkdir -p "$release_dir"
          manager_name="clover-classroom-manager-${version}-windows-x64.exe"
          cp "$manager_exe" "$release_dir/$manager_name"
          (cd "$release_dir" && sha256sum *.exe > SHA256SUMS.txt)

      - name: Upload Windows x64 build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows x64 assets
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-release
          path: dist/release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: 三叶草局域网课堂管理 ${{ github.ref_name }}
          body: |
            三叶草（Clover）局域网课堂管理的 Windows x64 版本。

            - 管理端 EXE：教师机运行。学生端已包含在程序内，用「分发客户端」导出安装包，其中写入当前管理端地址和公钥，并带上学生端 agent。
            - `SHA256SUMS.txt`：发布文件校验和。

            管理端为 Windows x86_64。学生机请安装管理端导出的安装包。
          files: dist/release/*
          fail_on_unmatched_files: true
