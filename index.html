<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机房小助手 · 管理端</title>
<link rel="stylesheet" href="./src/tokens.css">
<link rel="stylesheet" href="./src/base.css">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">机</span><span>机房小助手</span></div>
  <div class="crumb"><span>管理端</span><i>/</i><b>设备总览</b></div>
  <div class="actions">
    <button class="btn action" id="distBtn">分发客户端…</button>
    <button class="icon-btn" id="scanBtn" title="重新扫描局域网">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.8 3.8l1 1M11.2 11.2l1 1M3.8 12.2l1-1M11.2 4.8l1-1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
</header>

<main class="view view-in" style="container-type:inline-size">
  <div class="stats" id="kpis">
    <div class="kpi"><b id="kTotal">–</b><span>设备总数</span><small id="kTotalSub">301 机房</small></div>
    <div class="kpi"><b id="kOnline">–</b><span>在线</span><small id="kOnlineSub">–</small></div>
    <div class="kpi"><b id="kGuard">–</b><span>防护中</span><small id="kGuardSub">–</small></div>
    <div class="kpi"><b id="kAlert">–</b><span>告警</span><small id="kAlertSub">需要关注</small></div>
  </div>

  <div class="filters">
    <div class="segs" id="stateSegs">
      <button class="opt on" data-f="all">全部</button>
      <button class="opt" data-f="online">在线</button>
      <button class="opt" data-f="offline">离线</button>
      <button class="opt" data-f="alert">告警</button>
      <span class="thumb"></span>
    </div>
    <span class="anchor">
      <button class="field" id="roomField"><span class="k">机房</span><span class="v" id="roomVal">301 机房</span><span class="chev"><svg viewBox="0 0 10 10" width="8" height="8"><path d="M3 1.5l4 3.5-4 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 5 5)"/></svg></span></button>
      <div class="pop" id="roomMenu" hidden>
        <button class="mi sel" data-room="301">301 机房<span class="k">24 台</span></button>
        <button class="mi" data-room="302">302 机房<span class="k">0 台</span></button>
        <div class="sep"></div>
        <button class="mi" data-room="add">+ 添加机房…</button>
      </div>
    </span>
    <span class="grow"></span>
    <div class="search">
      <svg viewBox="0 0 14 14" width="12" height="12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.2 9.2L12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="搜索机器名 / 编号 / IP">
    </div>
  </div>

  <div class="batchbar" id="batchBar" hidden>
    <span class="n-sel" id="selCount">已选 0 台</span>
    <button class="btn action" id="batchOn">启用防护</button>
    <button class="btn action" id="batchOff">停用防护</button>
    <button class="btn action" id="batchTpl">应用模板…</button>
    <span class="grow"></span>
    <button class="btn" id="batchClear">取消选择</button>
  </div>

  <div class="card" style="overflow-x:auto">
    <table class="led selectable">
      <thead><tr>
        <th style="width:30px"><input type="checkbox" class="cbx" id="cbxAll" aria-label="全选"></th>
        <th style="width:58px">编号</th>
        <th>计算机名</th>
        <th style="width:110px">IP 地址</th>
        <th style="width:72px">状态</th>
        <th style="width:76px">防护</th>
        <th class="n" style="width:64px">功能</th>
        <th style="width:84px">心跳</th>
        <th style="width:56px"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<footer class="foot">
  <span class="status" id="status">正在连接…</span>
  <span class="toast" id="toast" hidden></span>
</footer>

<!-- 功能配置对话框：单机 / 批量模板共用 -->
<div class="modal" id="cfgModal" hidden>
  <div class="dialog" style="width:min(600px,100%)">
    <div class="d-head">
      <b id="cfgTitle">配置功能</b>
      <span class="note" id="cfgSub"></span>
    </div>
    <div class="d-body" id="cfgBody"></div>
    <div class="d-foot">
      <button class="btn" id="cfgAll">全选</button>
      <button class="btn" id="cfgNone">清空</button>
      <span style="flex:1"></span>
      <button class="btn action" id="cfgCancel">取消</button>
      <button class="btn action primary" id="cfgApply">应用</button>
    </div>
  </div>
</div>

<!-- 分发对话框 -->
<div class="modal" id="distModal" hidden>
  <div class="dialog" style="width:min(480px,100%)">
    <div class="d-head"><b>分发客户端</b><span class="note">学生机安装包</span></div>
    <div class="d-body" id="distBody">
      <div class="dist-grid">
        <span class="k">管理端地址</span>
        <div id="distAddrs" class="v">…</div>
        <span class="k">公钥指纹</span>
        <div class="v"><code class="mono" id="distFp">…</code></div>
        <span class="k">数据目录</span>
        <div class="v"><code class="mono" id="distDir" style="word-break:break-all">…</code></div>
      </div>
      <div class="dist-note">
        学生机装有还原软件：<b>请在非还原（解冻）状态下运行 install.bat</b>，
        确认上线后再冻结。安装包内含 client.json（已写入管理端地址与公钥）、
        agent.exe、install.bat。
      </div>
    </div>
    <div class="d-foot">
      <button class="btn action" id="distCancel">关闭</button>
      <button class="btn action primary" id="distExport">导出安装包…</button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
